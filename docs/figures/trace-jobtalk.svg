  <text class="hw-line" x="30" y="528" font-size="14" data-in="t5">조사 답을 받은 바로 뒤</text>
  <text class="hw-title" x="300" y="500" font-size="15" font-weight="700">인용한 135줄·27줄 모두 그 파일에 글자 그대로 있음</text>
  <text class="hw-line" x="300" y="522" font-size="15">'없다'며 낸 검색 2개를 다시 돌려 줄 수만 맞춰 봄: 1줄·0줄, AI 가 적은 수와 같음</text>
