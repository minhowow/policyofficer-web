  <text class="hw-title" x="300" y="594" font-size="15" font-weight="700">확인할 것 · 코드에서 본 것 — 개인정보 보호법 제28조의8제1항(시행령 제29조의7)</text>
  <text class="hw-line" x="300" y="616" font-size="15">없는 것: 국외 처리위탁에 대한 별도 동의, 또는 처리방침에 이전 국가·받는 자 등을 공개했다는 근거 처리가 코드에 없음</text>
