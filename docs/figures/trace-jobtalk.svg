  <text class="hw-title" x="300" y="406" font-size="15" font-weight="700">유지</text>
  <text class="hw-line" x="300" y="428" font-size="15">반대 근거를 찾아봤지만 앞 판단을 그대로 둠</text>
  <path class="hw-edge t-plain" d="M76 358 L76 382" marker-end="url(#how-trace-head)"/>
